name: Deploy Edge Function

on:
  push:
    paths:
      - 'supabase/functions/**'
      # Прапорці деплою — теж поведінка функції: без цього рядка зміна
      # `--no-verify-jwt` чекала б, доки хтось випадково зачепить її код.
      - '.github/workflows/deploy-edge-function.yml'
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set."
            echo "Go to Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "::error::SUPABASE_PROJECT_REF secret is not set."
            echo "Set it to your Supabase project reference ID."
            exit 1
          fi
          echo "All required secrets are configured."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy telegram-auth function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy telegram-auth \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --no-verify-jwt

      - name: Deploy validate-upload function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy validate-upload \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --no-verify-jwt

      - name: Deploy telegram-bot function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy telegram-bot \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --no-verify-jwt

      # БЕЗ перевірки JWT на шлюзі, як і решта. Функція автентифікує виклик
      # САМА (CRON_SECRET або службовий ключ, порівняння за сталий час,
      # fail-closed), а CRON_SECRET — випадковий рядок, НЕ JWT. З увімкненою
      # перевіркою шлюз відкидав би його з 401 ще ДО функції, тобто планувальник
      # не дійшов би до неї ніколи, хоч секрет на обох боках і збігається.
      - name: Deploy send-reminders function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy send-reminders \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --no-verify-jwt
