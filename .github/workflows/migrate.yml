name: Apply DB Migrations

# Автозастосування supabase/migrations/** до прод-БД.
#
# ВАЖЛИВО — перший запуск: усі наявні міграції (001–040) застосовувались
# вручну через Dashboard, тож у remote-історії CLI їх немає. Сліпий
# `db push` спробував би накотити ВСЕ з нуля і впав би на першому
# CREATE TABLE. Тому перед першим користуванням запусти цей workflow
# руками (Actions → Apply DB Migrations → Run workflow) з baseline=true —
# він позначить усі НАЯВНІ файли як застосовані, нічого не виконуючи.
# Після цього кожен пуш нової міграції в main застосовує лише її.
#
# Потрібні секрети (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN — токен акаунта (як у deploy-edge-function)
#   SUPABASE_PROJECT_REF  — ref проєкту
#   SUPABASE_DB_PASSWORD  — пароль БД (Dashboard → Settings → Database)

on:
  push:
    paths:
      - 'supabase/migrations/**'
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Позначити всі наявні міграції як застосовані (перший запуск, БЕЗ виконання SQL)'
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Незаданий секрет — це НЕ падіння, якщо воркфлоу поїхав сам собою.
      #
      # Він падав так 17 разів поспіль (жодного успішного запуску за всю
      # історію проєкту), тобто на КОЖНОМУ коміті в main висів червоний
      # хрестик. Ціна не в самому воркфлоу, а в тому, що червоний main
      # перестає щось означати: рівно через це в серпні одне справжнє
      # падіння встигло стати спадковим для трьох PR поспіль.
      #
      # Тому розрізняємо намір: автоматичний `push` із неналаштованими
      # секретами ПРОПУСКАЄМО з поміткою, а `workflow_dispatch` — це
      # свідома дія оператора, і мовчки «успішно нічого не зробити» там
      # було б гірше за падіння.
      - name: Verify secrets
        id: secrets
        run: |
          missing=""
          [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "${{ secrets.SUPABASE_PROJECT_REF }}"  ] || missing="$missing SUPABASE_PROJECT_REF"
          [ -n "${{ secrets.SUPABASE_DB_PASSWORD }}"  ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -z "$missing" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Немає секретів:$missing — запуск руками без них неможливий."
            exit 1
          fi
          echo "::notice::Автозастосування міграцій вимкнене: немає секретів$missing. Міграції накочуються вручну через Dashboard (див. RELEASE_CHECKLIST.md). Це НЕ падіння."

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.secrets.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Baseline (mark existing migrations as applied)
        if: ${{ steps.secrets.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.baseline }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          versions=$(ls supabase/migrations/*.sql | xargs -n1 basename | grep -oE '^[0-9]+' | sort -u)
          echo "Baseline versions: $versions"
          supabase migration repair --status applied $versions

      - name: Push new migrations
        if: ${{ steps.secrets.outputs.ok == 'true' && (github.event_name == 'push' || !inputs.baseline) }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Show migration status
        if: steps.secrets.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list
