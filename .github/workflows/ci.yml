name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  static-and-unit:
    name: type-check · lint · build · unit
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:9999
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # ТИМЧАСОВО: кадр, що не зійшовся, друкує себе в лог base64 —
          # артефакти CI недосяжні з пісочниці (blob-хост ріже проксі).
          SNAP_DUMP: '1'
      # Снапшоти сторінки на момент падіння — прямо в лог, без викачування
      # артефакту (page state видно одразу при діагностиці ран-онлі падінь)
      - name: Dump error contexts
        if: failure()
        run: |
          find test-results -name 'error-context.md' | while read -r f; do
            echo "════════ $f"
            cat "$f"
          done
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
