name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Пуш, зроблений GITHUB_TOKEN-ом (напр. коміт бейслайнів із update-snapshots),
  # НЕ запускає воркфлоу — GitHub так захищається від рекурсії. Без цього тригера
  # такий коміт лишався б узагалі без перевірки.
  workflow_dispatch:

# ЧОМУ ЦЕ ПОТРІБНО. Тригери `push` і `pull_request` спрацьовують ОБИДВА на
# кожен пуш у гілку з відкритим PR, тобто на один коміт бігли ДВА повні
# прогони e2e одночасно, конкуруючи за той самий раннер. Саме на цьому падав
# найважчий за часом тест (гонка двох завантажувачів у сповіщеннях: він
# свідомо тримає перший запит 6с і чекає ~9с) — в одному з пари прогонів
# проходив, у другому ні. Тобто «флейк» був не в тесті, а в тому, що ми самі
# вдвічі перевантажували раннер.
#
# Група нормалізована так, щоб push і pull_request на ОДНУ гілку потрапляли в
# ОДНУ групу: `head.ref` існує лише для PR-події, `ref_name` — для push, і
# обидва дають ім'я гілки. Інакше групи були б різні й обидва прогони вижили б.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: type-check · lint · build · unit
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:9999
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  migrations:
    name: міграції (справжній Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ЧОМУ ЦЕ ОКРЕМА РОБОТА. `supabase/migrations/` була ЄДИНОЮ текою репо
      # без жодної автоматичної перевірки — і саме там жили два найгірші
      # дефекти останніх раундів рев'ю: `ORDER BY` по неіснуючій колонці (весь
      # батч відкотився б, забравши безпековий фікс) і перейменовані ключі
      # JSON у RPC, чий єдиний споживач читав старі (порожній екран гостя без
      # жодного сигналу). Юніт-гарди їх не бачать у принципі: вони звіряють
      # ПІДРЯДКИ, а не виконують SQL.
      #
      # Постгрес на раннері вже стоїть (`/usr/lib/postgresql/*/bin`), тож
      # ставити нічого не треба — досить знайти версію.
      - name: Знайти Postgres
        run: echo "PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)" >> $GITHUB_ENV
      - name: Накотити всі міграції + поведінкові перевірки
        run: PGBIN=$PGBIN bash scripts/verify-migrations.sh

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Снапшоти сторінки на момент падіння — прямо в лог, без викачування
      # артефакту (page state видно одразу при діагностиці ран-онлі падінь)
      - name: Dump error contexts
        if: failure()
        run: |
          find test-results -name 'error-context.md' | while read -r f; do
            echo "════════ $f"
            cat "$f"
          done
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
