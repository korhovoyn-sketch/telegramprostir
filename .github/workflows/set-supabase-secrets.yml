name: Set Supabase Edge Function Secrets

# One-click setup: pushes TELEGRAM_BOT_TOKEN and SUPABASE_SERVICE_ROLE_KEY into
# Supabase Edge Function secrets. Both must first exist as GitHub repository
# secrets (Settings → Secrets and variables → Actions → New repository
# secret) — this workflow never accepts them as manual input, so their values
# never appear in a workflow_dispatch form, only in GitHub's encrypted secret
# store, and GitHub auto-redacts them from all logs.
#
# Required GitHub repository secrets:
#   SUPABASE_ACCESS_TOKEN     (already set for deploy-edge-function.yml)
#   SUPABASE_PROJECT_REF      (already set for deploy-edge-function.yml)
#   TELEGRAM_BOT_TOKEN        (bot token from @BotFather)
#   SUPABASE_SERVICE_ROLE_KEY (Supabase Dashboard → Project Settings → API → service_role)
#
# Run manually: Actions → Set Supabase Edge Function Secrets → Run workflow.
# Safe to re-run — supabase secrets set overwrites the existing value.

on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets
        run: |
          missing=0
          for s in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF TELEGRAM_BOT_TOKEN SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!s}" ]; then
              echo "::error::$s repository secret is not set (Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          exit $missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push secrets to Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          supabase secrets set \
            TELEGRAM_BOT_TOKEN="$BOT_TOKEN" \
            SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          echo "Supabase secrets updated."

      - name: Verify via telegram-auth diagnostics endpoint
        run: |
          RESP=$(curl -s "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/telegram-auth")
          echo "$RESP"
          echo "$RESP" | grep -q '"bot_token":true' && echo "✅ bot_token now set" || echo "::warning::bot_token still reports false — double-check the GitHub secret value"
          echo "$RESP" | grep -q '"service_key":true' && echo "✅ service_key now set" || echo "::warning::service_key still reports false — double-check the GitHub secret value"
