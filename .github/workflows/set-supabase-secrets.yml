name: Set Supabase Edge Function Secrets

# One-click setup: pushes ALLOWED_ORIGIN and TELEGRAM_BOT_TOKEN into Supabase
# Edge Function secrets (project-wide — applies to telegram-auth AND
# validate-upload, which both require ALLOWED_ORIGIN to serve any response at
# all, per their fail-closed CORS check).
#
# NOTE: SUPABASE_SERVICE_ROLE_KEY, SUPABASE_URL, SUPABASE_ANON_KEY, and
# SUPABASE_DB_URL are reserved by Supabase and injected into every Edge
# Function automatically — you cannot and do not need to set them via
# `supabase secrets set` or this workflow; Supabase's own secret-name
# validation rejects any name starting with SUPABASE_.
#
# TELEGRAM_BOT_TOKEN is a secret (never entered as workflow input) so its
# value only ever flows through GitHub's encrypted secret store. The Vercel
# domain is NOT secret (it's the app's public URL) so it's a plain input.
#
# Required GitHub repository secrets:
#   SUPABASE_ACCESS_TOKEN  (already set for deploy-edge-function.yml)
#   SUPABASE_PROJECT_REF   (already set for deploy-edge-function.yml)
#   TELEGRAM_BOT_TOKEN     (bot token from @BotFather)
#
# Run manually: Actions → Set Supabase Edge Function Secrets → Run workflow,
# enter the Vercel production domain (e.g. https://your-app.vercel.app — no
# trailing slash). Safe to re-run — supabase secrets set overwrites.

on:
  workflow_dispatch:
    inputs:
      vercel_domain:
        description: 'Vercel production domain, e.g. https://your-app.vercel.app (no trailing slash)'
        required: true
        type: string

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets
        run: |
          missing=0
          for s in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF TELEGRAM_BOT_TOKEN; do
            if [ -z "${!s}" ]; then
              echo "::error::$s repository secret is not set (Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          case "${{ inputs.vercel_domain }}" in
            https://*) ;;
            *) echo "::error::vercel_domain must start with https://"; missing=1 ;;
          esac
          exit $missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push secrets to Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          supabase secrets set \
            ALLOWED_ORIGIN="${{ inputs.vercel_domain }}" \
            TELEGRAM_BOT_TOKEN="$BOT_TOKEN" \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          echo "Supabase secrets updated."

      - name: Verify via telegram-auth diagnostics endpoint
        run: |
          RESP=$(curl -s "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/telegram-auth")
          echo "$RESP"
          echo "$RESP" | grep -q '"allowed_origin":true' && echo "✅ allowed_origin now set" || echo "::warning::allowed_origin still reports false"
          echo "$RESP" | grep -q '"bot_token":true' && echo "✅ bot_token now set" || echo "::warning::bot_token still reports false — double-check the GitHub secret value"
