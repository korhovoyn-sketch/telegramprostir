name: Update visual snapshots

# Перезнімає бейслайни `tests/e2e/screenshots.spec.ts-snapshots/` НА РАННЕРІ й
# комітить їх у гілку, на якій запущений.
#
# ЧОМУ ЦЕ МУСИТЬ РОБИТИ CI, А НЕ РОЗРОБНИК ЛОКАЛЬНО. Порівняння кадрів залежить
# від збірки Chromium: пісочниця Claude Code ганяє ЗАМОРОЖЕНИЙ предвстановлений
# браузер (141.0.7390.37 — `playwright install` там заборонений), CI ставить свій
# (148.0.7778.96). Сім мажорів різниці дають іншу растеризацію тексту: кадр,
# знятий у пісочниці, на раннері відрізняється на ratio 0.02 при порозі 0.01 БЕЗ
# жодного зсуву геометрії, тобто виглядає як «дизайн поїхав», хоч CSS ніхто не
# чіпав. Бейслайни іменуються по ПЛАТФОРМІ (`…-iphone-se-linux.png`), а не по
# збірці браузера, тож розбіжність невидима, доки не побіжить CI — саме так main
# простояв червоним три мерджі підряд.
#
# Тому середовище-власник бейслайна одне: це. Пісочниця спеку `screenshots`
# пропускає (див. `tests/e2e/helpers/env.ts`), решта 210 тестів ганяються всюди.
#
# ЦЕЙ ВОРКФЛОУ — НЕ ШТАМП. Він перезнімає кадри беззастережно (`=all`, див.
# коментар до кроку), тож так само радо «благословить» справжню регресію. Різниця середовищ не СТВОРЮЄ падінь — вона
# ховає їх локально: кадр, який лагодився цим воркфлоу вперше, був стухлий через
# РЕАЛЬНУ зміну дизайну (#92 додав `.fbtn.compact`), і в пісочниці той діф просто
# не дотягував до порога. Перед запуском переконайся, що діф відповідає зміні,
# яку ти справді зробив: артефакт `playwright-report` із CI має `-diff.png`.
#
# ДВА ТРИГЕРИ, і другий не для зручності. `workflow_dispatch` реєструється лише з
# ДЕФОЛТНОЇ гілки (GitHub віддає 404 на dispatch воркфлоу, якого нема в main), тож
# із фіча-гілки — до першого мерджу цього файлу — він недоступний. Пуш-подія ж бере
# воркфлоу з САМОЇ запушеної гілки, тому маркер у повідомленні коміту працює одразу:
#
#   git commit --allow-empty -m "chore: перезняти бейслайни [update-snapshots]"
#
# Після мерджу в main зручнішим стає dispatch: Actions → Update visual snapshots.

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  update:
    name: re-shoot baselines on the runner
    # Без гарда пуш-тригер перезнімав би бейслайни на КОЖЕН пуш, тобто «оновлював»
    # би їх під справжню регресію і гард перестав би щось означати.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update-snapshots]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # `CI` на Actions вже true, тож webServer підніме ПРОД-білд під `serve` —
      # той самий режим, у якому кадри потім перевіряються. Dev-сервер рендерить
      # не піксель-в-піксель те саме.
      # `=all` ОБОВʼЯЗКОВО, і це не педантизм. Голий `--update-snapshots` у
      # Playwright 1.60 має пресет `changed` — тобто перезнімає ЛИШЕ ті кадри,
      # що не пройшли порівняння. Кадр, чий діф не дотягнув до
      # `maxDiffPixelRatio: 0.01`, не оновлюється НІКОЛИ і тихо розходиться з
      # реальним рендером. Спіймано на живому випадку: рядок доступів змінив
      # верстку (три текстові кнопки → дві іконкові), воркфлоу відзвітував
      # «бейслайни вже збігаються», хоч кадр показував стару верстку — гліфів
      # змінилось менше за поріг. Наслідок неприємний саме тим, що невидимий:
      # наступна СПРАВЖНЯ регресія в тій зоні порівнювалась би зі стухлим
      # еталоном.
      - name: Re-shoot baselines
        run: npx playwright test screenshots --update-snapshots=all

      - name: Commit updated baselines
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Дві теки: `screenshots` (щасливі, заповнені екрани) і
          # `screenshots-states` (скелетон, порожньо, повтор, тост, підтвердження,
          # коачмарк, легальні). Прогін вище — `test screenshots` — підхоплює
          # обидві спеки за підрядком, тож комітити треба теж обидві.
          git add -A tests/e2e/screenshots.spec.ts-snapshots \
                     tests/e2e/screenshots-states.spec.ts-snapshots
          # Порожній коміт тут гірший за відсутність коміту: він виглядав би як
          # «бейслайни оновлено», хоч жоден кадр не змінився.
          if git diff --cached --quiet; then
            echo "Бейслайни вже збігаються з рендером раннера — комітити нічого."
            exit 0
          fi
          git commit \
            -m "test(visual): перезняти бейслайни на раннері" \
            -m "Кадри знято Chromium-ом раннера — єдиним, проти якого вони й перевіряються. Згенеровано воркфлоу update-snapshots."
          git push origin HEAD:${{ github.ref_name }}
          echo "::notice::Пуш зроблено GITHUB_TOKEN-ом, тож CI на цьому коміті САМ не запуститься (GitHub так захищається від рекурсії). Запусти його руками: Actions → CI → Run workflow на цій гілці."

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-update
          path: playwright-report/
          if-no-files-found: ignore
